name: Action self-test

on:
  pull_request:

permissions:
  contents: write        # the optimize job opens a PR with web-ready assets
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # The action under test, built from this very checkout. Optimize mode
      # is a no-op unless the PR changes a GLB; then it opens a PR against
      # the PR branch with the optimized files (cached by content hash).
      - uses: ./
        with:
          use-local: 'true'
          fail-on-budget: 'false'
          optimize: 'true'
