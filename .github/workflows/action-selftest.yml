name: Action self-test

on:
  pull_request:

permissions:
  contents: write        # the optimize job opens a PR with web-ready assets
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # install: false — the action under test runs its own
      # `pnpm install --frozen-lockfile` in use-local mode; this step only has
      # to put pnpm and node on PATH and warm the store.
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      # The action under test, built from this very checkout. Optimize mode
      # is a no-op unless the PR changes a GLB; then it opens a PR against
      # the PR branch with the optimized files (cached by content hash).
      - uses: ./
        with:
          use-local: 'true'
          fail-on-budget: 'false'
          optimize: 'true'
