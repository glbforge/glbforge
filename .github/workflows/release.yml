name: Release

# Publishes all packages to npm via OIDC trusted publishing when a v* tag
# is pushed. No tokens, no OTP: npm verifies the workflow identity itself.
#
# One-time setup on npmjs.com (per package: glbforge, @glbforge/core,
# @glbforge/meshy, @glbforge/mcp):
#   Package -> Settings -> Trusted Publisher -> GitHub Actions
#   org: glbforge   repo: glbforge   workflow: release.yml
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - run: pnpm -r test

      # npm >= 11.5 performs the OIDC exchange automatically when a trusted
      # publisher is configured.
      - run: npm install -g npm@latest

      # Publish flow: `pnpm pack` converts workspace:^ deps to real ranges,
      # `npm publish <tarball>` does the OIDC trusted publish with provenance.
      # Idempotent two ways: versions visible on the registry are skipped
      # up front, and EPUBLISHCONFLICT (e.g. a version that exists but sits
      # in npm security review, invisible to `npm view`) is treated as a
      # skip rather than a failure.
      - name: Publish packages not yet on the registry
        run: |
          set -euo pipefail
          for dir in packages/*; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip: $name@$version already published"
              continue
            fi
            echo "publish: $name@$version"
            tarball=$(cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP" | tail -1)
            if output=$(npm publish "$tarball" --access public --provenance 2>&1); then
              echo "$output" | tail -2
            elif echo "$output" | grep -qi 'previously published\|EPUBLISHCONFLICT\|cannot publish over'; then
              echo "skip: $name@$version exists (registry says already published)"
            else
              echo "$output"
              exit 1
            fi
          done
