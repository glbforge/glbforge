<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>GLBForge companion</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; font: 13px/1.35 -apple-system, "Segoe UI", system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    #bubble { position: absolute; left: 50%; top: 6%; transform: translateX(-50%) scale(0.9); max-width: 82%; padding: 8px 12px; border-radius: 14px;
      background: rgba(255,255,255,0.96); color: #1a1a1a; box-shadow: 0 2px 12px rgba(0,0,0,0.25); opacity: 0; transition: opacity .18s, transform .18s; pointer-events: none; text-align: center; }
    #bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }
    #bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px; background: inherit; transform: translateX(-50%) rotate(45deg); box-shadow: 2px 2px 4px rgba(0,0,0,0.08); }
    @media (prefers-color-scheme: dark) { #bubble { background: rgba(32,32,36,0.96); color: #f2f2f2; } }
    #status { position: absolute; left: 8px; bottom: 6px; color: rgba(255,255,255,0.7); text-shadow: 0 1px 2px rgba(0,0,0,0.6); font-size: 11px; pointer-events: none; opacity: 0; transition: opacity .3s; }
    #status.show { opacity: 1; }
  </style>
  <script type="importmap">
    { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="bubble"></div>
  <div id="status"></div>
  <script type="module" src="/renderer/app.js"></script>
</body>
</html>
