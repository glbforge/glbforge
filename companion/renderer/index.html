<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>GLBForge companion</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; font: 13px/1.35 -apple-system, "Segoe UI", system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    #bubble { position: absolute; left: 50%; top: 4%; transform: translateX(-50%) scale(0.9); max-width: 84%; padding: 8px 12px; border-radius: 14px;
      background: rgba(255,255,255,0.96); color: #1a1a1a; box-shadow: 0 2px 12px rgba(0,0,0,0.25); opacity: 0; transition: opacity .18s, transform .18s; pointer-events: none; text-align: center; white-space: pre-wrap; word-break: break-word; }
    #bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }
    #bubble.long { font-size: 11.5px; }
    #bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px; background: inherit; transform: translateX(-50%) rotate(45deg); box-shadow: 2px 2px 4px rgba(0,0,0,0.08); }
    #bubble.thinking { letter-spacing: 2px; }
    #bubble.thinking span { display: inline-block; animation: dot 1.2s infinite; }
    #bubble.thinking span:nth-child(2) { animation-delay: .2s } #bubble.thinking span:nth-child(3) { animation-delay: .4s }
    @keyframes dot { 0%, 60%, 100% { transform: translateY(0); opacity: .4 } 30% { transform: translateY(-3px); opacity: 1 } }
    #chat { position: absolute; left: 6%; right: 6%; bottom: 10px; display: none; }
    #chat.show { display: block; }
    #chat input { width: 100%; box-sizing: border-box; padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.15); background: rgba(255,255,255,0.97); color: #111; font: inherit; outline: none; box-shadow: 0 2px 12px rgba(0,0,0,0.25); }
    #chat input:focus { border-color: rgba(60,120,255,0.7); }
    #status { position: absolute; left: 8px; bottom: 6px; color: rgba(255,255,255,0.75); text-shadow: 0 1px 2px rgba(0,0,0,0.6); font-size: 11px; pointer-events: none; opacity: 0; transition: opacity .3s; }
    #status.show { opacity: 1; }
    @media (prefers-color-scheme: dark) { #bubble { background: rgba(32,32,36,0.96); color: #f2f2f2; } #chat input { background: rgba(32,32,36,0.97); color: #f2f2f2; border-color: rgba(255,255,255,0.15); } }
  </style>
  <script type="importmap">
    { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="bubble"></div>
  <div id="chat"><input id="chat-input" type="text" placeholder="say something… (Esc closes)" autocomplete="off" spellcheck="false"></div>
  <div id="status"></div>
  <script type="module" src="/renderer/app.js"></script>
</body>
</html>
